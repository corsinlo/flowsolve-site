name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_PREVIEW_MODE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:pages-cta
      - run: npm run test:build-finalization
      - run: npm run build
      - run: npm run test:static
      - run: npm run test:perf:interaction
      - run: npm run test:e2e
      - run: npm run test:budget
      - run: npm run test:perf:lighthouse
